<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Bakery Workshop</title>
    <style>
        :root {
            --bg: #fbf6ee;
            --card-bg: #ffffff;
            --accent: #ff8b60;
            --accent-hover: #ff7440;
            --green: #6bc274;
            --text: #4a3e3d;
            --text-light: #8c7a78;
            --border-radius: 20px;
            --shadow: 0 10px 25px -5px rgba(74, 62, 61, 0.08), 0 8px 10px -6px rgba(74, 62, 61, 0.04);
            --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', 'Quicksand', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Top Bar & Header */
        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 16px 28px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .currency-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s var(--bounce);
        }

        .currency-display.bump {
            transform: scale(1.25);
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        button.btn {
            background: #f0ebe1;
            border: none;
            color: var(--text);
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.btn:hover {
            background: #e4ddd0;
            transform: translateY(-2px);
        }

        /* Tutorial Banner */
        #tutorial {
            width: 100%;
            max-width: 900px;
            background: #fff4e5;
            border: 2px dashed #ffd8a8;
            padding: 14px 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            text-align: center;
            font-size: 1rem;
            color: #d97706;
        }

        /* Game Board Layout */
        .game-board {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .station {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-height: 220px;
            transition: border-color 0.2s ease;
            border: 2px solid transparent;
        }

        .station.drag-over {
            border-color: var(--accent);
            background: #fffdfa;
        }

        .station-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
            font-weight: 700;
            margin-bottom: 16px;
        }

        /* Pantry Grid */
        .pantry-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .item-card {
            background: #f9f6f0;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: grab;
            touch-action: none;
            transition: transform 0.2s var(--bounce), box-shadow 0.2s ease;
        }

        .item-card:active {
            cursor: grabbing;
        }

        .item-card .icon {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .item-card .count {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-light);
        }

        /* Interactive Elements / Slots */
        .target-slot {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #f4efe6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            position: relative;
            margin-top: auto;
            margin-bottom: auto;
            transition: transform 0.2s var(--bounce);
        }

        /* Progress Bar */
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #eee8dc;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .progress-bar-container.active {
            opacity: 1;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.1s linear;
        }

        /* Custom Action Buttons */
        .action-btn {
            margin-top: 12px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #d95d32;
            transition: all 0.1s ease;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #d95d32;
        }

        .action-btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Floating Draggable Overlay */
        .dragging-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 3rem;
            transform: translate(-50%, -50%) scale(1.1);
            transition: transform 0.05s ease;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        /* Toast Notifications */
        #notifications {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2000;
        }

        .toast {
            background: var(--text);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: var(--shadow);
            animation: slideIn 0.3s var(--bounce);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Modal Base */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(74, 62, 61, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 3000;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            max-width: 480px;
            width: 90%;
            box-shadow: var(--shadow);
            transform: scale(0.9);
            transition: transform 0.2s var(--bounce);
        }

        .modal.open .modal-card {
            transform: scale(1);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .shop-card {
            background: #fdfaf5;
            border: 1px solid #f0e8db;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div id="money" class="currency-display">
            🪙 $<span id="moneyValue">25</span>
        </div>
        <div class="nav-actions">
            <button class="btn" id="recipeBtn">📜 Recipe</button>
            <button class="btn" id="shopBtn">🛒 Shop</button>
        </div>
    </header>

    <div id="tutorial">
        <strong id="tutorialStep">Step 1: Prep Batter</strong> — Drag Flour, Sugar, Chocolate, and Milk into the bowl!
    </div>

    <main class="game-board">
        <!-- Pantry Station -->
        <div class="station" id="pantryStation">
            <div class="station-title">Pantry</div>
            <div class="pantry-grid">
                <div class="item-card" data-item="flour">
                    <span class="icon">🌾</span>
                    <span class="count">x<span id="flourCount">5</span></span>
                </div>
                <div class="item-card" data-item="sugar">
                    <span class="icon">🧂</span>
                    <span class="count">x<span id="sugarCount">5</span></span>
                </div>
                <div class="item-card" data-item="chocolate">
                    <span class="icon">🍫</span>
                    <span class="count">x<span id="chocolateCount">5</span></span>
                </div>
                <div class="item-card" data-item="milk">
                    <span class="icon">🥛</span>
                    <span class="count">x<span id="milkCount">5</span></span>
                </div>
                <div class="item-card" data-item="box">
                    <span class="icon">📦</span>
                    <span class="count">x<span id="boxCount">5</span></span>
                </div>
            </div>
        </div>

        <!-- Mixing Station -->
        <div class="station" id="mixingStation" data-drop="mixing">
            <div class="station-title">Mixing Bowl</div>
            <div class="target-slot" id="bowlSlot">🥣</div>
            <div class="progress-bar-container" id="mixProgress">
                <div class="progress-bar-fill" id="mixFill"></div>
            </div>
            <button class="action-btn" id="mixBtn" disabled>Hold to Mix</button>
        </div>

        <!-- Baking Station -->
        <div class="station" id="bakingStation" data-drop="baking">
            <div class="station-title">Oven</div>
            <div class="target-slot" id="ovenSlot">🔥</div>
            <div class="progress-bar-container" id="bakeProgress">
                <div class="progress-bar-fill" id="bakeFill"></div>
            </div>
            <button class="action-btn" id="bakeBtn" disabled>Bake</button>
        </div>

        <!-- Packaging & Sale Station -->
        <div class="station" id="saleStation" data-drop="sale">
            <div class="station-title">Register</div>
            <div class="target-slot" id="saleSlot">🏬</div>
            <button class="action-btn" id="sellBtn" disabled>Sell Product</button>
        </div>
    </main>

    <!-- Modals -->
    <div class="modal" id="shopModal">
        <div class="modal-card">
            <h2>Pantry Supplies</h2>
            <div class="shop-grid">
                <div class="shop-card">
                    <span>🌾 Flour (x5)</span>
                    <button class="btn" onclick="buySupply('flour', 5, 5)">Buy $5</button>
                </div>
                <div class="shop-card">
                    <span>🧂 Sugar (x5)</span>
                    <button class="btn" onclick="buySupply('sugar', 5, 5)">Buy $5</button>
                </div>
                <div class="shop-card">
                    <span>🍫 Choco (x5)</span>
                    <button class="btn" onclick="buySupply('chocolate', 5, 8)">Buy $8</button>
                </div>
                <div class="shop-card">
                    <span>🥛 Milk (x5)</span>
                    <button class="btn" onclick="buySupply('milk', 5, 4)">Buy $4</button>
                </div>
                <div class="shop-card">
                    <span>📦 Boxes (x5)</span>
                    <button class="btn" onclick="buySupply('box', 5, 6)">Buy $6</button>
                </div>
            </div>
            <button class="btn" style="margin-top: 20px; width:100%" onclick="closeModal('shopModal')">Close</button>
        </div>
    </div>

    <div id="notifications"></div>

    <script>
        // --- GAME STATE ---
        const state = {
            money: 25,
            supplies: { flour: 5, sugar: 5, chocolate: 5, milk: 5, box: 5 },
            bowlContents: new Set(),
            mixProgress: 0,
            isMixed: false,
            isBaked: false,
            isPackaged: false
        };

        const EMOJIS = {
            flour: '🌾', sugar: '🧂', chocolate: '🍫', milk: '🥛', box: '📦',
            batter: '🧪', bakedPan: '🥮', boxedBrownie: '🎁'
        };

        // --- DOM ELEMENTS ---
        const moneyVal = document.getElementById('moneyValue');
        const moneyDisplay = document.getElementById('money');
        const mixBtn = document.getElementById('mixBtn');
        const bakeBtn = document.getElementById('bakeBtn');
        const sellBtn = document.getElementById('sellBtn');

        // --- UI UPDATES ---
        function updateUI() {
            moneyVal.textContent = state.money;
            for (let key in state.supplies) {
                const el = document.getElementById(`${key}Count`);
                if (el) el.textContent = state.supplies[key];
            }
        }

        function notify(msg) {
            const container = document.getElementById('notifications');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // --- POINTER-BASED DRAG ENGINE (FLUID & MOBILE-READY) ---
        let activeDrag = null;

        document.querySelectorAll('.item-card').forEach(card => {
            card.addEventListener('pointerdown', (e) => {
                const itemType = card.dataset.item;
                if (state.supplies[itemType] <= 0) {
                    notify(`Out of ${itemType}! Check the shop.`);
                    return;
                }
                startDrag(e, itemType, EMOJIS[itemType]);
            });
        });

        function startDrag(e, type, symbol) {
            const ghost = document.createElement('div');
            ghost.className = 'dragging-ghost';
            ghost.textContent = symbol;
            document.body.appendChild(ghost);

            activeDrag = { type, element: ghost };
            updateGhostPosition(e);

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
        }

        function updateGhostPosition(e) {
            if (activeDrag) {
                activeDrag.element.style.left = `${e.clientX}px`;
                activeDrag.element.style.top = `${e.clientY}px`;
            }
        }

        function onPointerMove(e) {
            updateGhostPosition(e);
        }

        function onPointerUp(e) {
            if (!activeDrag) return;

            // Hit Detection
            activeDrag.element.hidden = true;
            const dropTarget = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-drop]');
            activeDrag.element.hidden = false;

            if (dropTarget) {
                handleDrop(activeDrag.type, dropTarget.dataset.drop);
            }

            activeDrag.element.remove();
            activeDrag = null;

            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
        }

        // --- GAME LOGIC & WORKFLOW ---
        function handleDrop(itemType, targetZone) {
            if (targetZone === 'mixing') {
                if (['flour', 'sugar', 'chocolate', 'milk'].includes(itemType)) {
                    if (!state.bowlContents.has(itemType)) {
                        state.supplies[itemType]--;
                        state.bowlContents.add(itemType);
                        updateUI();
                        notify(`Added ${itemType} to bowl!`);
                        
                        if (state.bowlContents.size === 4) {
                            mixBtn.disabled = false;
                            document.getElementById('mixProgress').classList.add('active');
                        }
                    }
                }
            } else if (targetZone === 'sale' && state.isBaked && itemType === 'box') {
                if (state.supplies.box > 0) {
                    state.supplies.box--;
                    state.isPackaged = true;
                    document.getElementById('saleSlot').textContent = EMOJIS.boxedBrownie;
                    sellBtn.disabled = false;
                    updateUI();
                    notify('Brownie packaged! Ready to sell.');
                }
            }
        }

        // --- INTERACTION CONTROLS ---
        let mixTimer = null;
        mixBtn.addEventListener('pointerdown', () => {
            mixTimer = setInterval(() => {
                state.mixProgress += 5;
                document.getElementById('mixFill').style.width = `${state.mixProgress}%`;
                if (state.mixProgress >= 100) {
                    clearInterval(mixTimer);
                    state.isMixed = true;
                    mixBtn.disabled = true;
                    bakeBtn.disabled = false;
                    document.getElementById('bowlSlot').textContent = EMOJIS.batter;
                    notify('Batter ready for baking!');
                }
            }, 100);
        });

        window.addEventListener('pointerup', () => clearInterval(mixTimer));

        bakeBtn.addEventListener('click', () => {
            bakeBtn.disabled = true;
            document.getElementById('bakeProgress').classList.add('active');
            let progress = 0;
            const bakeInterval = setInterval(() => {
                progress += 10;
                document.getElementById('bakeFill').style.width = `${progress}%`;
                if (progress >= 100) {
                    clearInterval(bakeInterval);
                    state.isBaked = true;
                    document.getElementById('ovenSlot').textContent = EMOJIS.bakedPan;
                    notify('Baking complete! Pack it up.');
                }
            }, 200);
        });

        sellBtn.addEventListener('click', () => {
            state.money += 35;
            moneyDisplay.classList.add('bump');
            setTimeout(() => moneyDisplay.classList.remove('bump'), 200);
            
            // Reset Loop
            state.bowlContents.clear();
            state.mixProgress = 0;
            state.isMixed = false;
            state.isBaked = false;
            state.isPackaged = false;

            document.getElementById('bowlSlot').textContent = '🥣';
            document.getElementById('ovenSlot').textContent = '🔥';
            document.getElementById('saleSlot').textContent = '🏬';
            document.getElementById('mixFill').style.width = '0%';
            document.getElementById('bakeFill').style.width = '0%';
            
            sellBtn.disabled = true;
            updateUI();
            notify('Sold for $35 profit!');
        });

        // Modal Handlers
        document.getElementById('shopBtn').onclick = () => document.getElementById('shopModal').classList.add('open');
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }

        function buySupply(item, amount, cost) {
            if (state.money >= cost) {
                state.money -= cost;
                state.supplies[item] += amount;
                updateUI();
                notify(`Bought ${amount}x ${item}!`);
            } else {
                notify('Not enough money!');
            }
        }

        updateUI();
    </script>
</body>
</html>
